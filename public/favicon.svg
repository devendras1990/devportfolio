<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090F"/>
      <stop offset="50%" stop-color="#0E101A"/>
      <stop offset="100%" stop-color="#07080D"/>
    </linearGradient>

    <!-- Signature Violet-to-Red Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6025F5"/>
      <stop offset="42%" stop-color="#8F62FF"/>
      <stop offset="82%" stop-color="#FF455B"/>
      <stop offset="100%" stop-color="#FF5555"/>
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8F62FF" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#6025F5" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#FF455B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF5555" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowViolet" cx="20%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#6025F5" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6025F5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="80%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FF5555" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF5555" stop-opacity="0"/>
    </radialGradient>

    <!-- Monogram Depth Filter -->
    <filter id="monogramGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#8F62FF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Squircle Shell -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#glowViolet)"/>
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#glowRed)"/>

  <!-- Crisp Border Frame -->
  <rect x="12" y="12" width="488" height="488" rx="106" fill="none" stroke="url(#borderGrad)" stroke-width="5" stroke-opacity="0.8"/>

  <!-- Subtle Corner Technical Accents -->
  <circle cx="68" cy="68" r="3.5" fill="#8F62FF" opacity="0.5"/>
  <circle cx="444" cy="68" r="3.5" fill="#8F62FF" opacity="0.5"/>
  <circle cx="68" cy="444" r="3.5" fill="#FF5555" opacity="0.5"/>
  <circle cx="444" cy="444" r="3.5" fill="#FF5555" opacity="0.5"/>

  <!-- Pure Vector DSB Monogram Group -->
  <g filter="url(#monogramGlow)">
    <!-- Letter 'D' -->
    <path d="M 92 168 C 92 152 104 140 120 140 L 166 140 C 206 140 236 170 236 210 L 236 302 C 236 342 206 372 166 372 L 120 372 C 104 372 92 360 92 344 Z M 128 176 L 128 336 L 164 336 C 188 336 200 322 200 298 L 200 214 C 200 190 188 176 164 176 Z" fill="url(#brandGrad)"/>

    <!-- Letter 'S' -->
    <path d="M 334 198 C 334 174 316 156 288 156 C 258 156 240 174 240 198 C 240 220 256 232 284 242 L 292 245 C 322 256 338 274 338 304 C 338 344 306 372 264 372 C 224 372 198 344 196 308 L 232 308 C 234 326 246 336 264 336 C 282 336 298 324 298 306 C 298 288 286 278 262 268 L 254 265 C 224 254 204 236 204 200 C 204 162 234 136 284 136 C 328 136 366 160 370 200 Z" transform="translate(14, 0)" fill="url(#brandGrad)"/>

    <!-- Letter 'B' -->
    <path d="M 326 168 C 326 152 338 140 354 140 L 402 140 C 430 140 448 156 448 180 C 448 198 438 212 422 220 C 442 228 454 244 454 268 C 454 296 432 316 400 316 L 354 316 C 338 316 326 304 326 288 Z M 362 176 L 362 214 L 398 214 C 412 214 418 206 418 195 C 418 184 412 176 398 176 Z M 362 242 L 362 280 L 400 280 C 414 280 422 272 422 261 C 422 250 414 242 400 242 Z" transform="translate(10, 28)" fill="url(#brandGrad)"/>
  </g>

  <!-- Signature Editorial Sparkle / AI Accent -->
  <polygon points="416,92 422,110 440,116 422,122 416,140 410,122 392,116 410,110" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="416" cy="116" r="16" fill="#8F62FF" opacity="0.35"/>
</svg>